<!-- view_reserved_tickets.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reserved Tickets - Admin | Virunga Express</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f9;
    }

    .container {
      margin: 50px auto;
      max-width: 1000px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #27ae60;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #27ae60;
      color: white;
    }

    tr:hover {
      background-color: #f2f2f2;
    }

    .btn-confirm {
      padding: 6px 12px;
      background-color: #2980b9;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-confirm:hover {
      background-color: #1c6691;
    }

    a.back {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      color: #27ae60;
    }

    a.back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Reserved Tickets</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Full Name</th>
          <th>Route</th>
          <th>Date</th>
          <th>Seats</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Example entries -->
        <tr>
          <td>1</td>
          <td>Jean Nkundwa</td>
          <td>Kigali to Musanze</td>
          <td>2025-04-10</td>
          <td>2</td>
          <td>0788123456</td>
          <td>Pending</td>
          <td><button class="btn-confirm">Confirm</button></td>
        </tr>
        <tr>
          <td>2</td>
          <td>Alice Mukamana</td>
          <td>Kigali to Rubavu</td>
          <td>2025-04-11</td>
          <td>1</td>
          <td>0788234567</td>
          <td>Confirmed</td>
          <td><button class="btn-confirm" disabled>Confirmed</button></td>
        </tr>
        <!-- More entries from backend -->
      </tbody>
    </table>

    <a href="admin_dashboard.html" class="back">← Back to Dashboard</a>
  </div>

</body>
</html>
