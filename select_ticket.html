<!-- select_ticket.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Virunga Express - Select Ticket</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }

    .container {
      background: #fff;
      padding: 30px;
      max-width: 600px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #27ae60;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: bold;
    }

    select, input[type="date"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #219150;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Virunga Express - Book Your Ticket</h2>
    <form action="reserve_ticket.php" method="POST">
      <label for="route">Select Route:</label>
      <select id="route" name="route" required>
        <option value="">-- Choose Route --</option>
        <option value="Kigali to Musanze">Kigali to Musanze</option>
        <option value="Kigali to Rubavu">Kigali to Rubavu</option>
        <option value="Kigali to Huye">Kigali to Huye</option>
      </select>

      <label for="travel_date">Travel Date:</label>
      <input type="date" id="travel_date" name="travel_date" required>

      <label for="seats">Number of Tickets:</label>
      <input type="number" id="seats" name="seats" min="1" max="10" required>

      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
